<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit Complaint - Estate App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f3f4f6;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .form-label {
      font-weight: 500;
    }

    .form-control,
    textarea,
    select {
      margin-bottom: 20px;
      border-radius: 8px;
    }

    button[type="submit"] {
      background: #5e60ce;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    button[type="submit"]:hover {
      background: #4e50b6;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .image-preview {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      margin-top: 10px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center">📩 Submit a Complaint</h2>

    <form action="/submit" method="POST" enctype="multipart/form-data">
      <!-- Title -->
      <div class="mb-3">
        <label for="title" class="form-label">Complaint Title</label>
        <input type="text" class="form-control" name="title" id="title" placeholder="e.g. Broken Gate" required>
      </div>

      <!-- Category -->
      <div class="mb-3">
        <label for="category" class="form-label">Complaint Category</label>
        <select name="category" id="category" class="form-select" required>
          <option value="" disabled selected>Choose Category</option>
          <option value="security">Security</option>
          <option value="maintenance">Maintenance</option>
          <option value="electricity">Electricity</option>
          <option value="cleaning">Cleaning</option>
          <option value="others">Others</option>
        </select>
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label for="description" class="form-label">Complaint Description</label>
        <textarea name="description" class="form-control" id="description" rows="4" placeholder="Explain the issue in detail..." required></textarea>
      </div>

      <!-- Image Upload -->
      <div class="mb-3">
        <label for="image" class="form-label">Upload Image (optional)</label>
        <input type="file" name="image" class="form-control" id="image" accept="image/*" onchange="previewImage(event)">
        <img id="preview" class="image-preview" alt="Image Preview" />
      </div>

      <div class="text-center">
        <button type="submit">Submit Complaint</button>
      </div>
    </form>

    <div class="back-link">
      <p><a href="/dashboard">← Back to Dashboard</a></p>
    </div>
  </div>

  <script>
    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById("preview");
        img.src = e.target.result;
        img.style.display = "block";
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
